# Passenger vhost fragment for looking-glass.
# Stock Apache 2.4 AllowEncodedSlashes Off returns a 404 HTML page before
# Passenger for PATH tokens that contain %2F (e.g. /http/https%3A%2F%2F…).
# NoDecode keeps %2F in PATH_INFO; the app unquotes it. `On` also works
# because collapsed https:/host is restored in http_envelope_query.
AllowEncodedSlashes NoDecode
