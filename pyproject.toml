[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looking-glass"
version = "0.1.0"
description = "Self-hosted looking glass: IP/domain intel, DNS, RDAP, path probes, and a request wall"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Cody" }
]
keywords = ["looking-glass", "ip", "dns", "rdap", "traceroute", "asn", "rir"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "Babel>=2.12",
  "tqdm>=4.66",
  "dnspython[dnssec]>=2.6",
  "cryptography>=42",
  "Jinja2>=3.1",
  "requests>=2.31",
  "aiohttp>=3.9",
  "pyasn>=1.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "acme>=2.0",
]

[project.scripts]
looking-glass = "looking_glass.cli:main"

[tool.setuptools.packages.find]
include = ["looking_glass*"]

[tool.setuptools.package-data]
"looking_glass.http" = ["templates/*.html", "static/*"]
"looking_glass.locales" = ["*.json"]
